<div class="box">
  <div class="row">
    <div class="col-md">
      <h4 i18n="address.cluster.first-transaction">First Transaction</h4>
      <div *ngIf="isLoading" class="text-center">
        <span class="skeleton-loader"></span>
      </div>
      <div *ngIf="!isLoading">
        <div *ngIf="firstTransaction; else noTransactions">
          <div class="transaction-box">
            <a [routerLink]="['/tx/' | relativeUrl, firstTransaction.txid]">
              <span class="transaction-id">{{ firstTransaction.txid }}</span>
            </a>
            <div class="transaction-date">
              <ng-container *ngIf="firstTransaction.status?.confirmed; else unconfirmed">
                {{ firstTransaction.status.block_time * 1000 | date:'medium' }}
              </ng-container>
              <ng-template #unconfirmed>
                <i i18n="transaction.unconfirmed">Unconfirmed</i>
              </ng-template>
            </div>
          </div>
        </div>
        <ng-template #noTransactions>
          <div class="text-center" i18n="address.cluster.no-transactions">No transactions found for this address.</div>
        </ng-template>
      </div>
    </div>
  </div>
  
  <!-- Cluster visualization with zoom functionality -->
  <div class="cluster-visualization">
    <div class="svg-container" #svgContainer>
      <svg #clusterSvg [attr.viewBox]="viewBox" width="100%" height="300">
        <!-- Define arrowhead marker -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                  refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="black" />
          </marker>
        </defs>
        <g [attr.transform]="transform">
          <!-- Transaction nodes and connections will be added here dynamically -->
        </g>
      </svg>
    </div>
  </div>
  
  <div class="legend mt-3">
    <div class="d-flex align-items-center mb-2">
      <div class="legend-circle cluster-node mr-2"></div>
      <span i18n="address.cluster.address-node">Address Payments</span>
    </div>
    <div class="d-flex align-items-center">
      <div class="legend-circle external-node mr-2"></div>
      <span i18n="address.cluster.external-node">External Payments</span>
    </div>
  </div>
</div>
